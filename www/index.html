<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <title>Chrono Heist - The Time Loop Puzzle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #00ff88;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            touch-action: manipulation;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border: 2px solid #00ff88;
            background: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            max-width: 100vw;
            max-height: 70vh;
            object-fit: contain;
        }

        .ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.9);
            padding: 8px;
            border: 1px solid #00ff88;
            border-radius: 5px;
            min-width: 150px;
            font-size: 12px;
        }

        .timer {
            font-size: 20px;
            color: #ff4444;
            text-align: center;
            margin-bottom: 8px;
        }

        .loop-counter {
            font-size: 14px;
            margin-bottom: 3px;
        }

        .status {
            font-size: 11px;
            margin-bottom: 3px;
        }

        .mobile-controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .control-pad {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .dpad {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            border-radius: 50%;
        }

        .dpad-button {
            position: absolute;
            width: 30px;
            height: 30px;
            background: rgba(0, 255, 136, 0.5);
            border: 1px solid #00ff88;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ff88;
            font-size: 16px;
            font-weight: bold;
            touch-action: manipulation;
        }

        .dpad-up { top: 10px; left: 45px; }
        .dpad-down { bottom: 10px; left: 45px; }
        .dpad-left { left: 10px; top: 45px; }
        .dpad-right { right: 10px; top: 45px; }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-button {
            width: 60px;
            height: 60px;
            background: rgba(0, 255, 136, 0.3);
            border: 2px solid #00ff88;
            border-radius: 50%;
            color: #00ff88;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            text-align: center;
        }

        .action-button:active {
            background: rgba(0, 255, 136, 0.6);
            transform: scale(0.95);
        }

        .title-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .title {
            font-size: 36px;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            margin-bottom: 20px;
            text-align: center;
        }

        .subtitle {
            font-size: 16px;
            color: #88ffaa;
            margin-bottom: 40px;
            text-align: center;
        }

        .start-button {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            padding: 15px 30px;
            background: transparent;
            color: #00ff88;
            border: 2px solid #00ff88;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        .start-button:active {
            background: #00ff88;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .hidden {
            display: none;
        }

        .mobile-info {
            position: absolute;
            bottom: 150px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border: 1px solid #00ff88;
            border-radius: 5px;
            font-size: 10px;
            text-align: center;
        }

        /* Responsive adjustments */
        @media screen and (max-width: 480px) {
            .title { font-size: 28px; }
            .subtitle { font-size: 14px; }
            .control-pad { width: 100px; height: 100px; }
            .dpad-button { width: 25px; height: 25px; font-size: 14px; }
            .action-button { width: 50px; height: 50px; font-size: 10px; }
            .ui-overlay { font-size: 10px; min-width: 120px; }
            .timer { font-size: 16px; }
        }

        @media screen and (orientation: landscape) {
            canvas { max-height: 60vh; }
            .mobile-controls { bottom: 5px; }
            .mobile-info { bottom: 80px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="title-screen" id="titleScreen">
            <h1 class="title">CHRONO HEIST</h1>
            <p class="subtitle">The Time Loop Puzzle</p>
            <button class="start-button" ontouchstart="startGame()" onclick="startGame()">BEGIN HEIST</button>
            <div class="mobile-info">
                <div>📱 Mobile Optimized</div>
                <div>Use virtual controls below</div>
            </div>
        </div>

        <div class="ui-overlay">
            <div class="timer" id="timer">90s</div>
            <div class="loop-counter" id="loopCounter">Loop: 1</div>
            <div class="status" id="gameStatus">Planning Phase</div>
            <div class="status" id="clonesInfo">Clones: 0</div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="mobile-controls">
            <div class="control-pad">
                <div class="dpad"></div>
                <div class="dpad-button dpad-up" id="moveUp">↑</div>
                <div class="dpad-button dpad-down" id="moveDown">↓</div>
                <div class="dpad-button dpad-left" id="moveLeft">←</div>
                <div class="dpad-button dpad-right" id="moveRight">→</div>
            </div>
            
            <div class="action-buttons">
                <button class="action-button" id="interactBtn">E<br>INTERACT</button>
                <button class="action-button" id="stealthBtn">STEALTH</button>
                <button class="action-button" id="toolBtn">TOOL</button>
                <button class="action-button" id="resetBtn">R<br>RESET</button>
            </div>
        </div>

        <div class="mobile-info hidden" id="gameInfo">
            <div id="phaseInfo">Explore and learn the layout</div>
        </div>
    </div>

    <script type="text/javascript" src="cordova.js"></script>
    <script src="game-mobile.js"></script>
</body>
</html>
