<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Heist - The Time Loop Puzzle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #00ff88;
            overflow: hidden;
            height: 100vh;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border: 2px solid #00ff88;
            background: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border: 1px solid #00ff88;
            border-radius: 5px;
            min-width: 200px;
        }

        .timer {
            font-size: 24px;
            color: #ff4444;
            text-align: center;
            margin-bottom: 10px;
        }

        .loop-counter {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .status {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border: 1px solid #00ff88;
            border-radius: 5px;
        }

        .title-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .title {
            font-size: 48px;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 20px;
            color: #88ffaa;
            margin-bottom: 40px;
        }

        .start-button {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            padding: 15px 30px;
            background: transparent;
            color: #00ff88;
            border: 2px solid #00ff88;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-button:hover {
            background: #00ff88;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="title-screen" id="titleScreen">
            <h1 class="title">CHRONO HEIST</h1>
            <p class="subtitle">The Time Loop Puzzle</p>
            <button class="start-button" onclick="startGame()">BEGIN HEIST</button>
        </div>

        <div class="ui-overlay">
            <div class="timer" id="timer">90s</div>
            <div class="loop-counter" id="loopCounter">Loop: 1</div>
            <div class="status" id="gameStatus">Planning Phase</div>
            <div class="status" id="clonesInfo">Clones: 0</div>
        </div>

        <canvas id="gameCanvas" width="1200" height="800"></canvas>

        <div class="controls">
            <div>WASD: Move | E: Interact | R: Reset Loop</div>
            <div>Space: Use Tool | Shift: Stealth Mode</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
